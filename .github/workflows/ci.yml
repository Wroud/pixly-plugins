name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test

  test-live-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run test:live

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm run package
      - run: unzip -q dist/pixly.zip -d dist/pixly
      - uses: actions/upload-artifact@v4
        with:
          name: pixly-plugin
          path: dist/pixly/
          include-hidden-files: true

  publish-mcp:
    needs: [test, test-live-mcp]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    timeout-minutes: 10
    concurrency:
      group: mcp-registry-publish
      cancel-in-progress: false
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v6
      - name: Check published version
        id: version
        run: bash .github/scripts/mcp-registry/check-version.sh
      - name: Install cosign
        if: steps.version.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Publish and verify MCP listing
        if: steps.version.outputs.publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: bash .github/scripts/mcp-registry/publish.sh
